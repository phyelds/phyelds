[tool.poetry]
name = "phyelds"
version = "8.5.0"
description = "A lightweight Python library to support aggregate computing!"
license = "Apache-2.0"
authors = [
  "Davide Domini <davide.domini@unibo.it>",
  "Gianluca Aguzzi <gianluca.aguzzi@unibo.it>"
]
homepage = "https://github.com/phyelds/phyelds"
repository = "https://github.com/phyelds/phyelds"

readme = "README.md"

include = [
    "LICENSE",
]

packages = [
    { include = "phyelds", from = "src" },
]

classifiers = [
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.urls]
"Changelog" = "https://github.com/phyelds/phyelds/blob/master/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["src/tests", "packages/phyelds-simulator/tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
wrapt = ">=1.17.2,<1.18.0"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.2.0"
pytest = "^9.0.3"
pylint = "^3.0.0"
pytest-cov = "^7.0.0"
ruff = "^0.3.0"
flake8 = "^7.0.0"
jedi = "^0.19.2"
# The tests, the examples and the playground of the docs run on the simulator.
phyelds-simulator = { path = "packages/phyelds-simulator", develop = true }

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs-material = "^9.7.7"
mkdocstrings = {extras = ["python"], version = "^1.0.7"}
mkdocs = ">=1.6,<2"

[tool.coverage.report]
# The tests build MicroPython bundles in temporary directories: they are copies of the
# package, not code of their own.
omit = ["*/pytest-of-*/*"]
