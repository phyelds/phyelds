[tool.poetry]
name = "phyelds-mesa"
version = "8.12.0"
description = "Mesa integration for phyelds: aggregate programs on the agents of a Mesa model"
license = "Apache-2.0"
authors = [
  "Davide Domini <davide.domini@unibo.it>",
  "Gianluca Aguzzi <gianluca.aguzzi@unibo.it>"
]
homepage = "https://github.com/phyelds/phyelds"
repository = "https://github.com/phyelds/phyelds"
readme = "README.md"

packages = [
    { include = "phyelds/mesa", from = "src" },
]

classifiers = [
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
phyelds = ">=8.0.0,<9.0.0"
# Mesa imports networkx when it starts, but declares it only in its network extra.
mesa = { version = ">=3.5.1,<4.0.0", extras = ["network"] }

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pylint = "^3.0.0"
flake8 = "^7.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
