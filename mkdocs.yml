site_name: phyelds
site_description: Lightweight, pythonic aggregate computing & field calculus toolkit.
site_url: https://phyelds.github.io/phyelds/
repo_url: https://github.com/phyelds/phyelds
repo_name: phyelds/phyelds
edit_uri: edit/master/docs/

exclude_docs: |
  examples/
  hooks/
  __pycache__/

theme:
  name: material
  logo: assets/phyelds-square.svg
  favicon: assets/phyelds-symbol.svg
  # Inter and JetBrains Mono come from extra_css, with all the weights the stylesheet uses.
  font: false
  features:
    - content.code.annotate
    - content.code.copy
    - navigation.footer
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=JetBrains+Mono:wght@400..700&display=swap
  - stylesheets/extra.css

hooks:
  # drafts first: the playground links the pages left in the navigation
  - docs/hooks/drafts.py
  - docs/hooks/playground.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [docs/examples]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      title: On this page

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src, packages/phyelds-simulator/src]
          options:
            docstring_style: auto
            filters: ["!^_"]
            merge_init_into_class: true
            show_source: false
            show_root_heading: true
            members_order: source

nav:
  - Home: index.md
  - Getting Started:
      - 1. Thinking in fields: concepts/aggregate-programs.md
      - 2. Step-by-step tutorial: tutorial.md
      - 3. Browser playground: playground/index.md
      - Interactive 3D walkthrough: walkthrough/index.md
  - Core Concepts:
      - State with remember: concepts/state.md
      - Neighborhoods & exchange: concepts/neighborhood-field.md
      - Alignment & @aggregate: concepts/alignment.md
      - Common pitfalls: pitfalls.md
  - Standard Libraries:
      - Overview & G-C-S pattern: concepts/libraries.md
      - Spreading, collection & gossip: libraries/spreading-and-collect.md
      - Leader election & processes: libraries/self-organisation.md
      - Time, reactive state & logic: libraries/time-and-logic.md
  - Simulator & Integration:
      - Built-in simulator: simulator.md
      - Running phyelds anywhere: integration/index.md
      - "Case study: VMAS": integration/vmas.md
      - Mesa: integration/mesa.md
      - Webots: integration/webots.md
      - ARGoS: integration/argos.md
      - MicroPython & ESP32: integration/micropython.md
  - Experimental:
      - What experimental means: experimental/index.md
      - Collective state machines: experimental/state-machines.md
      - Swarm behaviours: experimental/swarm.md
      - Formations: experimental/formations.md
  - API reference:
      - phyelds.calculus: reference/calculus.md
      - phyelds.data: reference/data.md
      - phyelds.experimental: reference/experimental.md
      - phyelds.experimental.formation: reference/formation.md
      - phyelds.libraries: reference/libraries.md
      - phyelds.simulator: reference/simulator.md
      - phyelds.vm: reference/vm.md
