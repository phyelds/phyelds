[tool.poetry]
name = "phyelds-simulator"
version = "8.11.1"
description = "A discrete-event simulator, with live rendering, for phyelds programs"
license = "Apache-2.0"
authors = [
  "Davide Domini <davide.domini@unibo.it>",
  "Gianluca Aguzzi <gianluca.aguzzi@unibo.it>"
]
homepage = "https://github.com/phyelds/phyelds"
repository = "https://github.com/phyelds/phyelds"
readme = "README.md"

packages = [
    { include = "phyelds/simulator", from = "src" },
]

classifiers = [
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
phyelds = ">=8.0.0,<9.0.0"
matplotlib = ">=3.10.1,<3.11.0"
pandas = "^2.2.3"
pydantic = "2.12.5"
ipython = { version = ">=8.10.0", optional = true }

[tool.poetry.extras]
jupyter = ["ipython"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
