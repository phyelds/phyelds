name: Native engine (phyelds-accel)
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  accel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.14t"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core and test dependencies
        run: pip install -e . -e packages/phyelds-accel pytest
      - name: Build and test native extension
        run: |
          python -m phyelds.accel.build
          python -m pytest packages/phyelds-accel/tests -v

  lint-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Configure Poetry
        run: poetry config virtualenvs.create false
      - name: Install dependencies
        run: poetry install
      - name: Lint phyelds-accel
        run: |
          PYTHONPATH="packages/phyelds-accel/src" poetry run pylint packages/phyelds-accel/src packages/phyelds-accel/tests
          poetry run flake8 packages/phyelds-accel/src packages/phyelds-accel/tests
      - name: Build phyelds-accel package
        working-directory: packages/phyelds-accel
        run: poetry build
