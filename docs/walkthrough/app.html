<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phyelds 3D Field Explorer</title>
  <meta name="description" content="From a field of sensor readings to a channel split into two networks, step by step, in 3D, next to the same fields at infinite density." />
  <link rel="icon" href="../assets/logo.png" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&amp;family=JetBrains+Mono:wght@400..700&amp;display=swap" />
  <link rel="stylesheet" href="walkthrough.css" />
  <script>
    // Follow the colour scheme chosen in the docs (Material keeps it in localStorage), else the
    // system's. It runs before the first paint, so that a dark page never flashes light.
    (() => {
      const system = matchMedia("(prefers-color-scheme: dark)");
      const key = `${new URL("..", location.href).pathname}.__palette`;
      const apply = () => {
        let scheme = null;
        try {
          scheme = JSON.parse(localStorage.getItem(key))?.color?.scheme ?? null;
        } catch {
          scheme = null;
        }
        const theme = (scheme ? scheme === "slate" : system.matches) ? "dark" : "light";
        if (document.documentElement.dataset.theme !== theme) {
          document.documentElement.dataset.theme = theme;
          dispatchEvent(new Event("themechange"));
        }
      };
      apply();
      system.addEventListener("change", apply);
      addEventListener("storage", apply);
    })();
  </script>
</head>
<body>
  <div class="wt">
    <header class="wt-bar">
      <a class="wt-home" href="../" title="Back to the documentation">
        <img src="../assets/logo.png" alt="" width="22" height="22" />
        <span>phyelds</span>
      </a>
      <nav class="wt-steps" id="wt-steps" aria-label="Steps"></nav>
    </header>

    <main class="wt-main">
      <section class="wt-stage" id="wt-stage" aria-label="The network in 3D">
        <canvas id="wt-scene"></canvas>

        <div class="wt-legend" id="wt-legend" aria-live="polite"></div>

        <div class="wt-tools">
          <label class="wt-chip wt-devices" title="Add devices: the network gets finer, and each device still hears only a few neighbors">
            <span>devices</span>
            <input id="wt-devices" type="range" step="1" />
            <output id="wt-devices-value" for="wt-devices">36</output>
          </label>
          <button class="wt-chip" id="wt-cloud" type="button" aria-pressed="true" title="Show the field at infinite density">
            <svg viewBox="0 0 16 16" aria-hidden="true"><g fill="currentColor"><circle cx="3" cy="9" r="1"/><circle cx="6" cy="6" r="1"/><circle cx="9" cy="8" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="5" cy="11" r="1"/><circle cx="10" cy="11" r="1"/><circle cx="13" cy="9" r="1"/></g></svg>
            Cloud
          </button>
          <button class="wt-icon" id="wt-home" type="button" title="Reset the view" aria-label="Reset the view">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.6-3.7M3 2.5v2.8h2.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>

        <figure class="wt-map">
          <canvas id="wt-map" aria-label="The network from above"></canvas>
          <figcaption>from above</figcaption>
        </figure>

        <div class="wt-player" role="group" aria-label="Rounds">
          <button class="wt-icon" id="wt-restart" type="button" title="Restart from round 0 (R)" aria-label="Restart from round 0">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3v10M13 3.5v9L6.5 8z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg>
          </button>
          <button class="wt-icon wt-icon--main" id="wt-play" type="button" title="Pause (Space)" aria-label="Pause">
            <svg class="wt-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3.5v9M10.5 3.5v9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <svg class="wt-resume" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.2v9.6L12.5 8z" fill="currentColor"/></svg>
          </button>
          <button class="wt-icon" id="wt-round-step" type="button" title="Run one round (.)" aria-label="Run one round">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3.5v9L9.5 8zM12 3v10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg>
          </button>
          <span class="wt-round" id="wt-round" aria-live="polite"></span>
        </div>

        <p class="wt-hint">Drag to orbit · scroll to zoom</p>
      </section>

      <aside class="wt-panel">
        <article class="wt-story">
          <p class="wt-kicker" id="wt-kicker"></p>
          <h1 class="wt-title" id="wt-title"></h1>
          <div class="wt-text" id="wt-text"></div>
          <p class="wt-try" id="wt-try"></p>
        </article>

        <section class="wt-program" aria-label="The program">
          <header class="wt-program-head">
            <span>Runs on every device</span>
            <a id="wt-playground" class="wt-link" href="../playground/">Open in the playground ↗</a>
          </header>
          <div class="wt-code highlight" id="wt-code"></div>
          <label class="wt-width" id="wt-width-row">
            <span>width</span>
            <input id="wt-width" type="range" min="0" max="2.5" step="0.1" value="0.8" />
            <output id="wt-width-value" for="wt-width">0.8</output>
          </label>
          <footer class="wt-device" id="wt-device">
            <span class="wt-device-name" id="wt-device-name"></span>
            <span class="wt-device-actions">
              <button class="wt-text-button" data-action="source" type="button">make source</button>
              <button class="wt-text-button" data-action="target" type="button">make target</button>
              <button class="wt-text-button" data-action="off" type="button">switch off</button>
            </span>
          </footer>
        </section>

        <nav class="wt-pager" aria-label="Previous and next step">
          <button class="wt-button" id="wt-previous" type="button">← Previous</button>
          <button class="wt-button wt-button--primary" id="wt-next" type="button">Next →</button>
        </nav>
      </aside>
    </main>
  </div>

  <script src="../playground/highlight.js"></script>
  <script type="module" src="walkthrough.js"></script>
</body>
</html>
