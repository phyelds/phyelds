name: test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Configure Poetry to not create virtualenvs (CI-friendly)
      run: poetry config virtualenvs.create false

    - name: Install dependencies
      run: poetry install

    - name: Lint with pylint
      run: |
        poetry run pylint src

    - name: Lint with flake8
      run: |
        poetry run flake8

    - name: Test with pytest
      run: poetry run pytest

  vmas:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Configure Poetry to not create virtualenvs (CI-friendly)
      run: poetry config virtualenvs.create false

    - name: Install core and VMAS dependencies
      run: |
        poetry install
        poetry run pip install vmas==1.5.2

    - name: Test VMAS extension
      run: PYTHONPATH="packages/phyelds-vmas/src" poetry run pytest packages/phyelds-vmas/tests

    - name: Build VMAS extension
      working-directory: packages/phyelds-vmas
      run: poetry build
