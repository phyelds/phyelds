[tool.poetry]
name = "phyelds-webots"
version = "8.10.0"
description = "Webots integration for phyelds: aggregate programs on the robots of a Webots simulation"
license = "Apache-2.0"
authors = [
  "Davide Domini <davide.domini@unibo.it>",
  "Gianluca Aguzzi <gianluca.aguzzi@unibo.it>"
]
homepage = "https://github.com/phyelds/phyelds"
repository = "https://github.com/phyelds/phyelds"
readme = "README.md"

packages = [
    { include = "phyelds/webots", from = "src" },
]

classifiers = [
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
phyelds = "^8.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pylint = "^3.0.0"
flake8 = "^7.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
