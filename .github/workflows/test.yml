name: test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # lets codecov authenticate the upload with OIDC, without a token
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Configure Poetry to not create virtualenvs (CI-friendly)
      run: poetry config virtualenvs.create false

    - name: Install dependencies
      run: poetry install

    - name: Lint with pylint
      run: |
        poetry run pylint src packages/phyelds-simulator/src packages/phyelds-simulator/tests

    - name: Lint with flake8
      run: |
        poetry run flake8

    - name: Test with pytest
      # By folder: the simulator is in the phyelds namespace, and coverage would not look
      # there for the modules no test imports.
      run: poetry run pytest --cov=src/phyelds --cov=packages/phyelds-simulator/src/phyelds --cov-report=xml

    - name: Build simulator package
      working-directory: packages/phyelds-simulator
      run: poetry build

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: coverage.xml
        use_oidc: true

  vmas:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Configure Poetry to not create virtualenvs (CI-friendly)
      run: poetry config virtualenvs.create false

    - name: Install core and VMAS dependencies
      run: |
        poetry install
        poetry run pip install vmas==1.5.2

    - name: Test VMAS extension
      run: PYTHONPATH="packages/phyelds-vmas/src" poetry run pytest packages/phyelds-vmas/tests

    - name: Build VMAS extension
      working-directory: packages/phyelds-vmas
      run: poetry build

  mesa:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Configure Poetry to not create virtualenvs (CI-friendly)
      run: poetry config virtualenvs.create false

    - name: Install core and Mesa dependencies
      run: |
        poetry install
        poetry run pip install "mesa[network]==3.5.1"

    - name: Lint Mesa extension
      run: PYTHONPATH="packages/phyelds-mesa/src" poetry run pylint packages/phyelds-mesa/src packages/phyelds-mesa/tests

    - name: Test Mesa extension
      run: PYTHONPATH="packages/phyelds-mesa/src" poetry run pytest packages/phyelds-mesa/tests

    - name: Build Mesa extension
      working-directory: packages/phyelds-mesa
      run: poetry build

  webots:
    runs-on: ubuntu-latest
    # Webots and xvfb come with the image; its Python is too old for phyelds, so the
    # controllers run on a Python 3.13 environment put first on the PATH by the test.
    container: cyberbotics/webots:R2025a-ubuntu22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Install core and test dependencies
      run: |
        uv venv --python 3.13 .venv
        uv pip install --python .venv/bin/python -e . pytest pylint

    - name: Lint Webots extension
      run: PYTHONPATH="packages/phyelds-webots/src" .venv/bin/python -m pylint packages/phyelds-webots/src packages/phyelds-webots/tests docs/examples/webots/controllers

    # The worlds download their robots from GitHub, which drops connections when many runners
    # ask at once: keep what Webots downloaded, even from a run that failed half-way.
    - name: Restore the robots Webots downloaded
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/Cyberbotics/Webots/assets
        key: webots-R2025a-assets-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: webots-R2025a-assets-

    - name: Test Webots extension, in Webots
      run: |
        command -v webots  # the world test is skipped without it
        PYTHONPATH="packages/phyelds-webots/src" xvfb-run -a .venv/bin/python -m pytest packages/phyelds-webots/tests

    - name: Keep the robots Webots downloaded
      if: always()
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/Cyberbotics/Webots/assets
        key: webots-R2025a-assets-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Build Webots extension
      run: uv build packages/phyelds-webots

  micropython:
    runs-on: ubuntu-latest
    env:
      MICROPYTHON_VERSION: v1.29.0

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Cache MicroPython
      id: cache-micropython
      uses: actions/cache@v4
      with:
        path: |
          micropython/ports/unix/build-standard/micropython
          micropython/mpy-cross/build/mpy-cross
        key: micropython-unix-mpy-cross-${{ env.MICROPYTHON_VERSION }}

    - name: Build the unix port of MicroPython
      if: steps.cache-micropython.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 --branch "$MICROPYTHON_VERSION" https://github.com/micropython/micropython
        make -C micropython/mpy-cross -j4
        make -C micropython/ports/unix submodules
        make -C micropython/ports/unix -j4

    - name: Put MicroPython and mpy-cross on the PATH
      run: |
        echo "$GITHUB_WORKSPACE/micropython/ports/unix/build-standard" >> $GITHUB_PATH
        echo "$GITHUB_WORKSPACE/micropython/mpy-cross/build" >> $GITHUB_PATH

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Configure Poetry to not create virtualenvs (CI-friendly)
      run: poetry config virtualenvs.create false

    - name: Install dependencies
      run: poetry install

    - name: Test on MicroPython
      run: |
        micropython -c "import sys; print(sys.implementation)"
        mpy-cross --version
        poetry run pytest src/tests/micropython -rs
